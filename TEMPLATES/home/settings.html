{% extends 'base.html' %}

{% block title %}Settings - CivicHub{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div style="padding: 24px; border-bottom: 1px solid var(--border);">
        <h2>System Configuration</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Manage platform defaults and notifications.</p>
    </div>
    
    <div style="padding: 24px;">
        <form>
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Organization Name</label>
                <input type="text" value="CivicHub Jharkhand" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Admin Email</label>
                <input type="email" value="admin@jharkhand.gov.in" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f3f4f6; padding-bottom: 15px;">
                <div>
                    <label style="font-weight: 500;">Email Alerts</label>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Notify when high priority issues are raised</div>
                </div>
                <input type="checkbox" checked style="transform: scale(1.5);">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <div>
                    <label style="font-weight: 500;">Maintenance Mode</label>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Prevent public access to the portal</div>
                </div>
                <input type="checkbox" style="transform: scale(1.5);">
            </div>

            <div style="text-align: right;">
                <button type="button" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
